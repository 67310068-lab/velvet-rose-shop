<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Velvet Rose Co., Ltd.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background: #F6F3ED; }
  </style>
</head>
<body class="text-[#4A151E] min-h-screen">

  <script>
    // ตรวจสอบสิทธิ์ถ้ายังไม่ได้กรอกรหัส 1234 จะถูกเด้งกลับไปหน้าหน้าร้านทันที
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      alert('⚠️ สิทธิ์ไม่ถูกต้อง! กรุณาใส่รหัสผ่านแอดมินที่หน้าร้านก่อนครับ');
      window.location.href = 'index.html';
    }
  </script>

  <div class="max-w-7xl mx-auto px-6 py-8">

    <!-- Header แอดมิน -->
    <header class="bg-white rounded-3xl p-6 border border-[#EFE8DE] shadow-md mb-8 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">👑</span>
        <div>
          <h1 class="text-2xl font-black text-[#681322]">Velvet Rose Admin Portal</h1>
          <p class="text-xs text-gray-500">ระบบจัดการคำสั่งซื้อและตรวจสอบสถานะการชำระเงินสำหรับเจ้าหน้าที่</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="loadAdminOrders()" class="px-4 py-2.5 text-xs font-bold text-[#681322] border border-[#681322]/20 rounded-xl hover:bg-[#F6F3ED] transition flex items-center gap-1 shadow-sm">
          🔄 รีเฟรชข้อมูล
        </button>
        <a href="index.html" class="px-4 py-2.5 text-xs font-bold text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-xl transition shadow-sm">
          ← ดูหน้าร้านสินค้า
        </a>
        <!-- ปุ่มออกจากระบบแอดมิน -->
        <button onclick="logoutAdmin()" class="px-5 py-2.5 text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 rounded-xl transition shadow-md active:scale-95">
          🚪 ออกจากระบบแอดมิน
        </button>
      </div>
    </header>

    <!-- ตารางคำสั่งซื้อ -->
    <div class="bg-white rounded-3xl p-8 border border-[#EFE8DE] shadow-2xl">
      <div class="mb-6 flex justify-between items-center">
        <h2 class="text-xl font-extrabold text-[#681322]">📋 รายการสั่งซื้อของลูกค้า (Admin Orders)</h2>
        <span class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-3.5 py-1 rounded-full font-bold">
          🟢 สถานะ: เข้าสู่ระบบแอดมินสำเร็จ
        </span>
      </div>

      <div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-[#581C25] text-white">
              <th class="p-4 font-bold">ข้อมูลลูกค้า</th>
              <th class="p-4 font-bold">รายการสินค้าที่สั่งซื้อ</th>
              <th class="p-4 font-bold">ยอดรวมทั้งหมด</th>
              <th class="p-4 font-bold">สถานะการชำระเงิน</th>
              <th class="p-4 font-bold">วัน-เวลาที่สั่งซื้อ</th>
            </tr>
          </thead>
          <tbody id="adminOrdersTable" class="divide-y divide-gray-100 bg-white">
            <!-- ข้อมูลตารางแอดมิน -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    async function loadAdminOrders() {
      const table = document.getElementById('adminOrdersTable');
      try {
        const res = await fetch('http://localhost:5000/api/admin/orders');
        const orders = await res.json();

        table.innerHTML = orders.map(o => `
          <tr class="hover:bg-gray-50/80 border-b border-gray-100 transition">
            <td class="p-4">
              <div class="font-bold text-[#581C25]">${o.customerName}</div>
              <div class="text-xs text-gray-400 font-light">${o.email}</div>
            </td>
            <td class="p-4 text-xs font-semibold text-gray-700">${o.items}</td>
            <td class="p-4 font-black text-[#681322] text-base">${o.total.toLocaleString()} บาท</td>
            <td class="p-4">
              <button onclick="togglePaymentStatus('${o.id}')" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-xs font-bold ${o.status === 'ชำระเงินเรียบร้อย' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-amber-100 text-amber-800 border border-amber-300'} shadow-sm hover:scale-105 active:scale-95 transition">
                ${o.status === 'ชำระเงินเรียบร้อย' ? '✓ ชำระเงินเรียบร้อย' : '⏳ รอชำระเงิน (กดเพื่ออนุมัติ)'}
              </button>
            </td>
            <td class="p-4 text-xs text-gray-500 font-medium">${o.date}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function togglePaymentStatus(orderId) {
      try {
        const res = await fetch('http://localhost:5000/api/admin/orders/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId })
        });
        await res.json();
        loadAdminOrders();
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการอัปเดตสถานะ');
      }
    }

    // ปุ่มออกจากระบบแอดมิน
    function logoutAdmin() {
      localStorage.removeItem('isAdminLoggedIn');
      alert('👋 ออกจากระบบแอดมินเรียบร้อยแล้ว');
      window.location.href = 'index.html';
    }

    loadAdminOrders();
  </script>
</body>
</html>
